<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Halfmoon CSS -->
    <link rel="stylesheet" href="/css/halfmoon.min.css">
    <!-- Icons CSS -->
    <link rel="stylesheet" href="/css/icons.css?v=4">
    <script>
        const currentPageId = 'home';
    </script>
    <script src="/js/icons.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/navigation.js"></script>
    <title>Simtezilo</title>
    <style>
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            padding: 1rem 2rem 2rem 2rem;
        }

        .vehicle-card {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .vehicle-card h3 {
            margin-bottom: 1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .vehicle-info {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.75rem;
            font-size: 1.1rem;
        }

        .vehicle-info-inline {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .vehicle-info-inline .vehicle-value {
            text-align: center;
        }

        .race-info-inline {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            font-size: 1.1rem;
            align-items: center;
        }

        .race-info-inline .vehicle-label {
            margin-right: 0.5rem;
        }

        .race-info-item {
            display: flex;
            align-items: center;
        }

        #raceTimeOfDay {
            display: inline-block;
            min-width: 5.5rem;
        }

        .vehicle-label {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }

        .vehicle-value {
            color: #fff;
            font-weight: 600;
        }

        .vehicle-placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }

        .game-state-card {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-state-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
        }

        .state-main-menu {
            color: #6c757d;
        }

        .state-race-menu {
            color: #ffc107;
        }

        .state-on-circuit {
            color: #28a745;
        }

        .state-replay {
            color: #17a2b8;
        }

        .state-paused {
            color: #fd7e14;
        }

        .state-unknown {
            color: rgba(255, 255, 255, 0.4);
        }

        .info-row {
            display: grid;
            grid-template-columns: 0.4fr 1.3fr 1.3fr;
            gap: 1rem;
            margin-top: 1.75rem;
            margin-bottom: 0.75rem;
            padding: 0 2rem;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 0.5rem;
        }

        .status-connected {
            background-color: #28a745;
            box-shadow: 0 0 8px #28a745;
        }

        .status-disconnected {
            background-color: #6c757d;
        }

        .lap-events-container {
            margin-top: 1.5rem;
            overflow-x: auto;
        }

        .lap-events-table {
            width: 100%;
            border-collapse: collapse;
        }

        .lap-events-table th {
            text-align: left;
            padding: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.95rem;
        }

        .lap-events-table td {
            padding: 0.75rem;
            color: #fff;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .lap-events-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .lap-events-table td.lap-delta-positive {
            color: #dc3545 !important;
        }

        .lap-events-table td.lap-delta-negative {
            color: #28a745 !important;
        }

        .lap-events-table td.fastest-lap {
            color: #28a745 !important;
            font-weight: 700;
        }

        .lap-events-table td.slowest-lap {
            color: #dc3545 !important;
            font-weight: 700;
        }

        .lap-events-empty {
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }
    </style>
</head>

<body data-bs-theme="dark">
    <div id="navigation"></div>

    <div class="content-container">
        <div class="info-row">
            <div class="vehicle-card game-state-card">
                <span class="game-state-value" id="gameStateText">
                    <span class="vehicle-placeholder" data-i18n="runmode.home.gamestate.connecting">Connecting...</span>
                </span>
            </div>

            <div class="vehicle-card">
                <div class="vehicle-info-inline">
                    <span class="status-indicator" id="vehicleStatus"></span>
                    <span class="vehicle-value" id="vehicleText">
                        <span class="vehicle-placeholder" data-i18n="runmode.home.vehicle.unknown">Unknown
                            Vehicle</span>
                    </span>
                </div>
            </div>

            <div class="vehicle-card">
                <div class="vehicle-info-inline">
                    <span class="status-indicator" id="circuitStatus"></span>
                    <span class="vehicle-value" id="circuitText">
                        <span class="vehicle-placeholder" data-i18n="runmode.home.circuit.unknown">Unknown
                            Circuit</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- Hidden translation elements for JavaScript to reference -->
        <span style="display: none;" data-i18n="runmode.home.circuit.waiting">Analyzing...</span>
        <span style="display: none;" data-i18n="runmode.home.gamestate.mainmenu">Main Menu</span>
        <span style="display: none;" data-i18n="runmode.home.gamestate.racemenu">Race Menu</span>
        <span style="display: none;" data-i18n="runmode.home.gamestate.oncircuit">Live</span>
        <span style="display: none;" data-i18n="runmode.home.gamestate.replay">Replay</span>
        <span style="display: none;" data-i18n="runmode.home.gamestate.paused">Paused</span>
        <span style="display: none;" data-i18n="runmode.home.gamestate.unknown">Unknown</span>

        <div class="cards-container">
            <div class="vehicle-card" style="grid-column: 1 / -1;">
                <h3>
                    <span data-i18n="runmode.home.race.title">Race</span>
                    <span class="status-indicator" id="raceStatus"></span>
                </h3>
                <div class="race-info-inline">
                    <div class="race-info-item">
                        <span class="vehicle-label" data-i18n="runmode.home.race.timeofday">Time of Day:</span>
                        <span class="vehicle-value" id="raceTimeOfDay"></span>
                    </div>
                    <div class="race-info-item">
                        <span class="vehicle-label" data-i18n="runmode.home.race.lap">Lap:</span>
                        <span class="vehicle-value" id="raceLap"></span>
                    </div>
                    <div class="race-info-item">
                        <span class="vehicle-label" data-i18n="runmode.home.race.position">Position:</span>
                        <span class="vehicle-value" id="racePosition"></span>
                    </div>
                </div>
                <div class="lap-events-container">
                    <table class="lap-events-table">
                        <thead>
                            <tr>
                                <th data-i18n="runmode.home.race.lapevent.lap">Lap</th>
                                <th data-i18n="runmode.home.race.lapevent.laptime">Lap Time</th>
                                <th data-i18n="runmode.home.race.lapevent.delta">Delta</th>
                                <th data-i18n="runmode.home.race.lapevent.position">Position</th>
                            </tr>
                        </thead>
                        <tbody id="lapEventsBody">
                            <tr>
                                <td colspan="4" class="lap-events-empty" data-i18n="runmode.home.race.waiting">Waiting
                                    for data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/shared-websocket.js"></script>
    <script src="/js/vehicle-info.js"></script>
    <script src="/js/circuit-info.js"></script>
    <script src="/js/race-info.js"></script>
    <script src="/js/game-state-manager.js"></script>
</body>

</html>
